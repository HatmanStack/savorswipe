[project]
name = "savorswipe-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.37.0",
    "pymupdf==2.0",
    "boto3>=1.43.111",
    "requests>=2.34.2",
    "Pillow>=13.0.0",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "requests-mock>=1.12.1",
    "moto[s3]>=5.2.5",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
